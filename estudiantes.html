<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Neón - Links</title>
  <style>
    /* Reset y Estilos Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08090c;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 24, 33, 0.8) 0%, #08090c 100%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Panel Contenedor Principal */
    .neon-panel {
      background: rgba(16, 19, 26, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 900px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .panel-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .panel-logo {
      max-height: 60px;
      width: auto;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
    }

    /* Grilla de Botones */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    /* Botón Base (Link Envolvente) */
    .neon-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      text-decoration: none;
      background: linear-gradient(135deg, #13161c 0%, #0c0e12 100%);
      border-radius: 14px;
      border: 1px solid var(--btn-color);
      color: #ffffff;
      outline: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      
      /* Sombras neón en reposo */
      box-shadow: 
        0 6px 0 var(--btn-shadow-color),
        0 10px 15px rgba(0, 0, 0, 0.6),
        inset 0 0 12px var(--btn-glow-soft);

      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Brillo Neón en Hover */
    .neon-btn:hover {
      box-shadow: 
        0 6px 0 var(--btn-shadow-color),
        0 0 20px var(--btn-glow),
        inset 0 0 15px var(--btn-glow-soft);
      border-color: #ffffff;
    }

    /* EFECTO FÍSICO: Hundimiento en Active */
    .neon-btn:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 var(--btn-shadow-color),
        0 0 25px var(--btn-glow),
        inset 0 0 20px var(--btn-glow);
    }

    /* Ícono Neón */
    .neon-btn svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--btn-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--btn-color));
      transition: filter 0.12s ease;
      flex-shrink: 0;
    }

    .neon-btn:hover svg {
      filter: drop-shadow(0 0 10px var(--btn-color));
    }

    /* Texto del Botón */
    .btn-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .btn-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 0 8px var(--btn-glow);
      white-space: nowrap;
    }

    .btn-sub {
      font-size: 11px;
      color: #7a8b9e;
      letter-spacing: 1px;
    }

    /* --- PALETA DE COLORES NEÓN --- */
    .btn-cyan {
      --btn-color: #00f0ff;
      --btn-shadow-color: #008891;
      --btn-glow: rgba(0, 240, 255, 0.6);
      --btn-glow-soft: rgba(0, 240, 255, 0.12);
    }

    .btn-magenta {
      --btn-color: #ff0077;
      --btn-shadow-color: #990047;
      --btn-glow: rgba(255, 0, 119, 0.6);
      --btn-glow-soft: rgba(255, 0, 119, 0.12);
    }

    .btn-green {
      --btn-color: #00ff66;
      --btn-shadow-color: #00993d;
      --btn-glow: rgba(0, 255, 102, 0.6);
      --btn-glow-soft: rgba(0, 255, 102, 0.12);
    }

    .btn-yellow {
      --btn-color: #ffb700;
      --btn-shadow-color: #996e00;
      --btn-glow: rgba(255, 183, 0, 0.6);
      --btn-glow-soft: rgba(255, 183, 0, 0.12);
    }

    .btn-purple {
      --btn-color: #b026ff;
      --btn-shadow-color: #6a1799;
      --btn-glow: rgba(176, 38, 255, 0.6);
      --btn-glow-soft: rgba(176, 38, 255, 0.12);
    }

    .btn-orange {
      --btn-color: #ff5500;
      --btn-shadow-color: #993300;
      --btn-glow: rgba(255, 85, 0, 0.6);
      --btn-glow-soft: rgba(255, 85, 0, 0.12);
    }

    .btn-blue {
      --btn-color: #0066ff;
      --btn-shadow-color: #003d99;
      --btn-glow: rgba(0, 102, 255, 0.6);
      --btn-glow-soft: rgba(0, 102, 255, 0.12);
    }

    .btn-pink {
      --btn-color: #ff66cc;
      --btn-shadow-color: #993d7a;
      --btn-glow: rgba(255, 102, 204, 0.6);
      --btn-glow-soft: rgba(255, 102, 204, 0.12);
    }

    .btn-lime {
      --btn-color: #ccff00;
      --btn-shadow-color: #7a9900;
      --btn-glow: rgba(204, 255, 0, 0.6);
      --btn-glow-soft: rgba(204, 255, 0, 0.12);
    }

    .btn-red {
      --btn-color: #ff2233;
      --btn-shadow-color: #99141f;
      --btn-glow: rgba(255, 34, 51, 0.6);
      --btn-glow-soft: rgba(255, 34, 51, 0.12);
    }

    /* Colores adicionales para completar los 15 botones con tono único */

    .btn-amber {

    }

    .btn-indigo {
      --btn-color: #6600ff;
      --btn-shadow-color: #3d0099;
      --btn-glow: rgba(102, 0, 255, 0.6);
      --btn-glow-soft: rgba(102, 0, 255, 0.12);
    }

    .btn-emerald {

      --btn-shadow-color: #009966;
      --btn-glow: rgba(0, 255, 170, 0.6);
      --btn-glow-soft: rgba(0, 255, 170, 0.12);
    }

    .btn-violet {

      --btn-shadow-color: #820099;
      --btn-glow: rgba(216, 0, 255, 0.6);
      --btn-glow-soft: rgba(216, 0, 255, 0.12);
    }

    /* Adaptación Responsive */
    @media (max-width: 500px) {
      .neon-panel {
        padding: 20px 12px;
      }

      .button-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .neon-btn {
        padding: 12px 14px;
        gap: 10px;
      }

      .neon-btn svg {
        width: 20px;
        height: 20px;
      }

      .btn-label {
        font-size: clamp(9px, 3vw, 13px);
        letter-spacing: 0.3px;
      }
    }
  </style>
