<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlaces INTECH</title>
  <style>
    /* Reset y Estilos Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a192f; /* Azul marino plano */
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Panel Contenedor Principal */
    .neon-panel {
      background: rgba(16, 25, 44, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .panel-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .panel-logo {
      max-height: 60px;
      width: auto;
      display: block;
    }

    /* Grilla de Botones */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    /* Botón Base (Bordes y Letras Blancas) */
    .neon-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      text-decoration: none;
      background: #112240;
      border-radius: 14px;
      border: 2px solid #ffffff; /* Borde blanco */
      color: #ffffff;
      outline: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      
      box-shadow: 0 4px 0 #ffffff;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .neon-btn:hover {
      background: #1d3557;
      border-color: #ffffff;
    }

    /* Hundimiento al hacer click */
    .neon-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #ffffff;
    }

    /* Ícono Blanco */
    .neon-btn svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Texto del Botón */
    .btn-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .btn-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff; /* Letras blancas */
      white-space: nowrap;
    }

    /* --- EFECTO PULSE ULTRA LLAMATIVO (CIAN NEÓN) --- */
    .neon-btn.btn-pulse {
      border-color: #00f2fe;
      color: #00f2fe;
      box-shadow: 0 4px 0 #00f2fe, 0 0 15px rgba(0, 242, 254, 0.5);
      animation: pulse-attention 1.6s infinite ease-in-out;
    }

    .neon-btn.btn-pulse svg {
      stroke: #00f2fe;
    }

    .neon-btn.btn-pulse .btn-label {
      color: #00f2fe;
    }

    .neon-btn.btn-pulse:hover {
      background: #002b4d;
      border-color: #00f2fe;
    }

    @keyframes pulse-attention {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 0 #00f2fe, 0 0 0 0 rgba(0, 242, 254, 0.8);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 4px 0 #00f2fe, 0 0 25px 8px rgba(0, 242, 254, 0.6);
      }
      70% {
        box-shadow: 0 4px 0 #00f2fe, 0 0 35px 18px rgba(0, 242, 254, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 4px 0 #00f2fe, 0 0 0 0 rgba(0, 242, 254, 0);
      }
    }

    /* Adaptación Responsive */
    @media (max-width: 500px) {
      .neon-panel {
        padding: 20px 12px;
      }

      .button-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .neon-btn {
        padding: 12px 14px;
        gap: 10px;
      }

      .neon-btn svg {
        width: 20px;
        height: 20px;
      }

      .btn-label {
        font-size: clamp(9px, 3vw, 13px);
        letter-spacing: 0.3px;
      }
    }
  </style>
</head>
